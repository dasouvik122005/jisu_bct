<nav class="navbar">
  <div class="nav-brand">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="brand-icon">
      <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00d2ff" />
          <stop offset="100%" stop-color="#3a7bd5" />
        </linearGradient>
      </defs>
      <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
      <path d="M2 17l10 5 10-5"></path>
      <path d="M2 12l10 5 10-5"></path>
    </svg>
    <span class="logo">Todolist</span>
  </div>

  <div class="nav-center">
    <ul class="nav-links">
      <li><a routerLink="/home" routerLinkActive="active">Home</a></li>
      <li><a routerLink="/about" routerLinkActive="active">About</a></li>
    </ul>
  </div>

  <div class="nav-end">
    <div class="auth-buttons desktop-only">
      <a routerLink="/login" class="nav-btn btn-ghost">Log In</a>
      <a routerLink="/register" class="nav-btn btn-solid">Sign Up</a>
    </div>
    
    <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
      @if (isLightMode()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      }
    </button>
    
    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-label="Menu">
      <span class="bar" [class.open]="isMenuOpen()"></span>
      <span class="bar" [class.open]="isMenuOpen()"></span>
      <span class="bar" [class.open]="isMenuOpen()"></span>
    </button>
  </div>
</nav>

<!-- Mobile Overlay -->
<div class="mobile-overlay" [class.active]="isMenuOpen()" (click)="closeMenu()"></div>

<!-- Mobile Sidebar -->
<div class="mobile-sidebar" [class.active]="isMenuOpen()">
  <div class="sidebar-header">
    <span class="logo">Todolist</span>
    <button class="close-btn" (click)="closeMenu()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  
  <ul class="mobile-nav-links">
    <li><a routerLink="/home" (click)="closeMenu()" routerLinkActive="active">Home</a></li>
    <li><a routerLink="/about" (click)="closeMenu()" routerLinkActive="active">About</a></li>
  </ul>
  
  <div class="mobile-auth">
    <a routerLink="/login" class="nav-btn btn-ghost" (click)="closeMenu()">Log In</a>
    <a routerLink="/register" class="nav-btn btn-solid" (click)="closeMenu()">Sign Up</a>
  </div>
</div>

<router-outlet></router-outlet>
