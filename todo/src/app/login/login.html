<div class="auth-container">
  <div class="brutalist-card auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </div>
      <h2>Log In</h2>
      <p>Enter your credentials to access your account.</p>
    </div>
    
    <form (ngSubmit)="login()" class="auth-form">
      <div *ngIf="errorMessage" class="error-message">{{errorMessage}}</div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="email" name="email" [(ngModel)]="credentials.email" placeholder="you@example.com" class="brutalist-input" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="password" name="password" [(ngModel)]="credentials.password" placeholder="••••••••" class="brutalist-input" required>
        </div>
      </div>

      <button type="submit" class="brutalist-btn btn-primary">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Create one now</a>
    </div>
  </div>
</div>
