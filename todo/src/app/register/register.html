<div class="auth-wrapper reverse">
  <div class="auth-visual">
    <div class="floating-elements">
      <div class="shape shape-4"></div>
      <div class="shape shape-5"></div>
      <div class="shape shape-3"></div>
    </div>
    <div class="visual-content">
      <h2>Join Us Today</h2>
      <p>Start organizing your life with our elegant and powerful task manager built just for you.</p>
    </div>
  </div>
  <div class="auth-form-container">
    <div class="auth-card">
      <div class="card-header">
        <h2>Create Account</h2>
        <p>Fill in the details to get started.</p>
      </div>
      
      <form (ngSubmit)="register()">
        <div *ngIf="errorMessage" class="error-msg" style="color: #ef4444; margin-bottom: 15px; font-size: 14px; text-align: center;">{{errorMessage}}</div>
        <div *ngIf="successMessage" class="success-msg" style="color: #10b981; margin-bottom: 15px; font-size: 14px; text-align: center;">{{successMessage}}</div>
        
        <div class="form-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="name" name="name" [(ngModel)]="user.name" placeholder="John Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="email" name="email" [(ngModel)]="user.email" placeholder="you@example.com" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="password" name="password" [(ngModel)]="user.password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-options">
          <label class="terms-checkbox">
            <input type="checkbox" name="terms" [(ngModel)]="user.terms" required>
            <span>I agree to the <a href="#">Terms</a> & <a href="#">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn-primary btn-block">Sign Up</button>
      </form>

      <div class="card-footer">
        Already have an account? <a routerLink="/login">Log In</a>
      </div>
    </div>
  </div>
</div>
