<div class="auth-container">
  <div class="brutalist-card auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <h2>Create Account</h2>
      <p>Fill in the details to get started.</p>
    </div>
    
    <form (ngSubmit)="register()" class="auth-form">
      <div *ngIf="errorMessage" class="error-message">{{errorMessage}}</div>
      <div *ngIf="successMessage" class="error-message" style="background: var(--secondary-color); color: var(--text-primary);">{{successMessage}}</div>
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" id="name" name="name" [(ngModel)]="user.name" placeholder="John Doe" class="brutalist-input" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="email" name="email" [(ngModel)]="user.email" placeholder="you@example.com" class="brutalist-input" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="password" name="password" [(ngModel)]="user.password" placeholder="••••••••" class="brutalist-input" required>
        </div>
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px;">
        <input type="checkbox" name="terms" [(ngModel)]="user.terms" required style="width: 20px; height: 20px; border: 2px solid black;">
        <span style="font-weight: 600; font-size: 0.95rem;">I agree to the Terms & Privacy Policy</span>
      </div>

      <button type="submit" class="brutalist-btn btn-primary">Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Log In</a>
    </div>
  </div>
</div>
