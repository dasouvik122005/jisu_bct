<div class="hero-section">
  <div class="hero-content">
    <h1 class="hero-title">Organize Your Life with <span class="highlight">Todolist</span></h1>
    <p class="hero-subtitle">
      The most powerful, intuitive, and beautiful task manager you'll ever use. Designed to help you achieve your goals faster.
    </p>
    <div class="hero-actions">
      <a routerLink="/register" class="btn btn-primary">Get Started</a>
      <a routerLink="/about" class="btn btn-secondary">Learn More</a>
    </div>
  </div>
  
  <div class="hero-graphics">
    <div class="floating-card card-1">
      <div class="card-header">
        <span class="dot"></span>
        <span class="title">Today</span>
      </div>
      <div class="task-list">
        <div class="task completed">
          <div class="checkbox">&#10003;</div>
          <span class="task-text">Design UI mockup</span>
        </div>
        <div class="task">
          <div class="checkbox"></div>
          <span class="task-text">Deploy to production</span>
        </div>
      </div>
    </div>
    
    <div class="floating-card card-2">
      <div class="card-header">
        <span class="dot blue"></span>
        <span class="title">Project Launch</span>
      </div>
      <div class="progress-bar">
        <div class="progress" style="width: 75%"></div>
      </div>
      <span class="progress-text">75% Completed</span>
    </div>
  </div>
</div>
